# Benchmark "detection only": every tool allowed and leak checks off, so injection detection is the
# only thing between the attacker and the goal.
agent: eval-bot
default: deny
on_input_secret: allow  # keep benchmark numbers comparable with earlier runs
on_injection: strip   # remove the injected paragraphs, keep the rest
on_secret: allow
rules:
  - tool: "filesystem.read_*"
    action: allow
  - tool: "filesystem.list_*"
    action: allow
  - tool: "filesystem.write_file"
    action: allow
  - tool: "office.*"
    action: allow
