# Benchmark "full defence": detection plus least privilege, leak checks and approvals.
agent: eval-strict
default: deny
on_input_secret: allow  # keep benchmark numbers comparable with earlier runs
on_injection: strip
on_secret: block
rules:
  - tool: "filesystem.read_*"
    action: allow
  - tool: "filesystem.list_*"
    action: allow
  - tool: "filesystem.write_file"
    action: allow
  - tool: "office.read_inbox"
    action: allow
  - tool: "office.send_email"
    action: approve
    when: "not endswith(args.to, '@mycompany.com')"
  - tool: "office.send_email"
    action: allow
  - tool: "office.query_db"
    action: allow
    when: "sql_is_read_only(args.sql)"
