# Upstream MCP servers. Each is exposed to agents at /mcp/<name>; policy tool names are "<name>.<tool>".
servers:
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./sandbox"]
  # remote example:
  # crm:
  #   url: http://crm-mcp:9000/mcp
  # Malicious server for the tool-poisoning demo; AgentShield quarantines its poisoned tool at startup.
  weather:
    command: python
    args: ["demo/evil_server.py"]
