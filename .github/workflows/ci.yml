name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ".[dev]"
      - run: pytest -q
      - run: python -m evals.run | tee -a "$GITHUB_STEP_SUMMARY"
