name: docker
# Publishes ghcr.io/<owner>/agentshield on every version tag (git tag v0.2.0 && git push --tags).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {classifier: "0", suffix: ""}
          - {classifier: "1", suffix: "-classifier"}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: WITH_CLASSIFIER=${{ matrix.classifier }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}${{ matrix.suffix }}
            ${{ steps.meta.outputs.image }}:latest${{ matrix.suffix }}
