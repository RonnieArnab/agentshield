[project]
name = "agentshield"
version = "0.1.0"
description = "Security and cost gateway for AI agents: MCP tool policies, prompt-injection detection, approvals, audit, LLM routing."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "fastapi>=0.115",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2",
  "aiosqlite",
  "asyncpg",
  "pyyaml",
  "litellm",
  "prometheus-client",
  "httpx",
]

[project.optional-dependencies]
classifier = ["transformers", "torch"]
dev = ["pytest"]

[tool.setuptools]
packages = ["agentshield"]

[tool.setuptools.package-data]
agentshield = ["ui.html"]
